<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelos e Patas - Agendamento</title>
  <style>
    :root {
      --laranja: #fb6d0d;
      --azul: #025590;
      --azul-escuro: #063b61;
      --cinza-texto: #666;
      --cinza-claro: #f4f6f8;
      --branco: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--cinza-claro);
      color: var(--cinza-texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--branco);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      text-align: center;
      border-top: 6px solid var(--laranja);
    }

    .header {
      background-color: var(--azul-escuro);
      color: var(--branco);
      padding: 25px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--cinza-claro);
      opacity: 0.9;
    }

    .owner-section {
      padding: 25px 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
