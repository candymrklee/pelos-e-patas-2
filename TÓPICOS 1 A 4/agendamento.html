<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelos e Patas - Agendamento</title>
  <style>
    :root {
      --laranja: #fb6d0d;
      --azul: #025590;
      --azul-escuro: #063b61;
      --cinza-texto: #666;
      --cinza-claro: #f4f6f8;
      --branco: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--cinza-claro);
      color: var(--cinza-texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--branco);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      text-align: center;
      border-top: 6px solid var(--laranja);
    }

    .header {
      background-color: var(--azul-escuro);
      color: var(--branco);
      padding: 25px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--cinza-claro);
      opacity: 0.9;
    }

    .owner-section {
      padding: 25px 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .owner-photo-container {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--laranja);
      overflow: hidden;
      margin-bottom: 12px;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .owner-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .owner-info h2 {
      font-size: 1.2rem;
      color: var(--azul);
      margin-bottom: 4px;
    }

    .owner-info p {
      font-size: 0.9rem;
      color: var(--cinza-texto);
    }

    .content {
      padding: 15px 25px 30px;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 25px;
      color: var(--cinza-texto);
    }

    .btn-agendar {
      display: inline-block;
      width: 100%;
      background-color: var(--laranja);
      color: var(--branco);
      text-decoration: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 12px rgba(251, 109, 13, 0.3);
    }

    .btn-agendar:hover {
      background-color: #e05e07;
      transform: translateY(-2px);
    }

    .footer {
      background-color: var(--cinza-claro);
      padding: 12px;
      font-size: 0.8rem;
      color: var(--cinza-texto);
      border-top: 1px solid #e9ecef;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="assets/logo.png" alt="Pelos e Patas" class="header-logo">
      <p>Cuidado e carinho para o seu pet</p>
    </div>

    <div class="owner-section">
      <div class="owner-photo-container">
        <img src="assets/dona.png" alt="Foto da Proprietária">
      </div>
      <div class="owner-info">
        <h2>Atendimento Personalizado</h2>
        <p>Com toda a dedicação que seu pet merece!</p>
      </div>
    </div>

    <div class="content">
      <p class="description">
        Escolha o melhor dia e horário para trazer o seu amiguinho.<br>
        Clique no botão abaixo para abrir nossa agenda oficial.
      </p>

      <a 
        href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ2skykkF4lFEv_yyOxAqeYIDRTMxUdp8b5LFe5i45ESJmlV9NUrmgjtGtX_gYsRcBiy5PBP9KyB" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="btn-agendar">
        Agendar Horário Agora
      </a>
    </div>

    <div class="footer">
      Petshop Pelos e Patas &copy; Todos os direitos reservados
    </div>
  </div>

</body>
</html>
